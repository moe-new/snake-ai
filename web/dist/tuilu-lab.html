<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>退路 · 实验台</title>
<meta name="description" content="视频《退路》的实验台：六条贪吃蛇，换个开局，看它们一步步怎么走。">
<style>:root {
  --bg: #0f1117; --bg2: #161925; --board: #1a1e29; --edge: #272d3d; --text: #f1efe9; --dim: #8a8fa6;
  --gold: #f2c14e; --gold-dim: #c8a76b; --blue: #6aa8ff; --red: #ff6b78; --wire: #8ea6d8; --green: #86ecc2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  background: radial-gradient(120% 80% at 50% 0%, #1b1f2c 0%, var(--bg2) 38%, var(--bg) 100%) fixed, var(--bg);
  font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
b.gold { color: var(--gold); font-weight: 600; } b.red { color: var(--red); font-weight: 600; } b.blue { color: var(--blue); font-weight: 600; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 6px; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .title { height: 30px; width: auto; display: block; transform: translateY(5px); }
.brand .sub { color: var(--gold-dim); font-size: 13px; letter-spacing: 0.4em; }
.views { display: flex; background: rgba(255,255,255,0.04); border: 1px solid var(--edge); border-radius: 999px; padding: 3px; }
.views button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; color: var(--dim); font-size: 14px; }
.views button[aria-pressed="true"] { background: rgba(242,193,78,0.14); color: var(--gold); }

/* layout */
main { max-width: 1180px; margin: 0 auto; padding: 4px 16px 32px; display: grid; gap: 18px; }
.stage { min-width: 0; }
.panel { display: grid; gap: 16px; align-content: start; }
body[data-view="single"] .race-only, body[data-view="race"] .single-only { display: none !important; }

/* who is playing */
.who { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 2px 0; }
.who h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: 0.06em; font-weight: 700; }
.who .en { color: var(--gold-dim); font-size: 11px; letter-spacing: 0.22em; margin-top: 3px; }
.who .len { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.who .len b { font-size: 34px; font-weight: 700; }
.who .len span { color: var(--dim); margin-left: 4px; }
.line { margin: 6px 2px 4px; color: var(--dim); font-size: 14px; min-height: 1.5em; }

/* the board */
.boardwrap { position: relative; width: 100%; aspect-ratio: 1; margin: 2px 0 4px; }
#board { width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
.banner { position: absolute; left: 50%; bottom: 9%; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s;
  background: rgba(15,17,23,0.82); border: 1px solid var(--edge); border-radius: 16px; padding: 10px 22px; text-align: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; }
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.banner b { display: block; font-size: 26px; letter-spacing: 0.12em; }
.banner span { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.banner.won { border-color: rgba(242,193,78,0.5); } .banner.won b { color: var(--gold); }
.banner.dead b, .banner.cycle b { color: var(--red); }

/* transport */
.transport { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px; }
.play { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid rgba(242,193,78,0.6); background: rgba(242,193,78,0.08); position: relative; }
.play::before { content: ""; position: absolute; inset: 0; margin: auto; width: 0; height: 0; border-left: 14px solid var(--gold); border-top: 9px solid transparent; border-bottom: 9px solid transparent; transform: translateX(2px); }
.play[data-state="pause"]::before { width: 12px; height: 16px; border: 0; transform: none; background: linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 8px, var(--gold) 8px 12px); }
.step { flex: none; width: 30px; height: 40px; border: 0; background: none; color: var(--dim); font-size: 26px; line-height: 1; }
#scrub { flex: 1; min-width: 0; height: 40px; touch-action: none; cursor: pointer; }
.speed { flex: none; min-width: 52px; height: 34px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(255,255,255,0.04); font-size: 14px; font-variant-numeric: tabular-nums; }
body[data-view="race"] .transport { justify-content: center; gap: 14px; }

/* why */
.whybox { min-height: 3.4em; margin: 6px 2px 0; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); font-size: 15px; }
.whybox #step { display: block; font-size: 12px; letter-spacing: 0.08em; }

/* panel */
.group { display: grid; gap: 10px; }
.label { font-size: 12px; color: var(--gold-dim); letter-spacing: 0.3em; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(255,255,255,0.025); text-align: left; transition: border-color .2s, background .2s; }
.chip b { font-size: 16px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.chip span { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: rgba(242,193,78,0.65); background: rgba(242,193,78,0.08); }
.chip[aria-pressed="true"] b { color: var(--gold); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 6px 12px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(255,255,255,0.025); font-size: 14px; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { border-color: rgba(242,193,78,0.65); color: var(--gold); background: rgba(242,193,78,0.08); }
.switch { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-size: 14px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .knob { width: 40px; height: 24px; border-radius: 999px; background: rgba(255,255,255,0.1); position: relative; transition: background .2s; flex: none; }
.switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .2s; }
.switch input:checked + .knob { background: rgba(242,193,78,0.55); }
.switch input:checked + .knob::after { transform: translateX(16px); }
.switch input:focus-visible + .knob { outline: 2px solid var(--gold); outline-offset: 2px; }
.switches { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.dims { display: flex; align-items: center; gap: 8px; }
.dims[hidden] { display: none; }
.dims label { display: inline-flex; align-items: center; gap: 6px; }
.dims input { width: 64px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(0,0,0,0.25); font-variant-numeric: tabular-nums; }
.dims .small { font-size: 12px; margin-left: 4px; }
.seedrow { display: flex; align-items: center; gap: 10px; }
.seedrow input { width: 96px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(0,0,0,0.25); font-variant-numeric: tabular-nums; }
.seedrow button, .soundbtn { padding: 7px 14px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(255,255,255,0.04); }
.soundbtn[aria-pressed="true"] { border-color: rgba(242,193,78,0.65); color: var(--gold); }
.soundbtn::before { content: "♪ "; color: var(--gold-dim); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--dim); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend .b { background: var(--blue); } .legend .g { background: var(--gold); } .legend .r { background: var(--red); }
.legend .w { background: none; width: 14px; height: 10px; border-right: 2.5px solid var(--wire); border-bottom: 2.5px solid var(--wire); transform: rotate(-45deg) scale(0.7); }
.hint { margin: 0; font-size: 13px; color: var(--dim); min-height: 0; }
.hint:empty { display: none; }
.about { font-size: 12px; color: #6b7088; line-height: 1.7; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }

/* the race */
.racehead { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 2px 10px; }
.racehead h1 { margin: 0; font-size: 22px; letter-spacing: 0.06em; }
.racegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { border-radius: 12px; padding: 4px 4px 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); transition: border-color .3s; }
.card canvas { width: 100%; aspect-ratio: 1; display: block; }
.card .name { text-align: center; font-weight: 600; letter-spacing: 0.04em; margin-top: 2px; font-size: 14px; white-space: nowrap; }
.card .status { text-align: center; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card.won { border-color: rgba(242,193,78,0.5); } .card.won .status { color: var(--gold); }
.card.dead .status, .card.cycle .status { color: var(--red); }
.results { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
.results li { display: grid; grid-template-columns: 28px 1fr auto; align-items: baseline; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,0.03); }
.results .rank { color: var(--dim); font-variant-numeric: tabular-nums; }
.results .num { color: var(--text); font-variant-numeric: tabular-nums; }
.results li.first { background: rgba(242,193,78,0.08); } .results li.first .num, .results li.first .rank { color: var(--gold); }
.results li.out .num { color: var(--red); }

@media (min-width: 640px) { .racegrid { gap: 12px; } .card { padding: 6px 6px 10px; } .card .name { font-size: 15px; } .card .status { font-size: 13px; } }
@media (min-width: 960px) {
  main { grid-template-columns: minmax(0, 1fr) 340px; gap: 36px; padding-top: 10px; }
  .stage { max-width: 720px; justify-self: center; width: 100%; }
  .boardwrap { width: min(100%, calc(100vh - 330px)); min-width: 420px; margin-left: auto; margin-right: auto; }
  body[data-view="race"] .racegrid { width: min(100%, calc((100vh - 250px) * 1.2)); min-width: 560px; margin: 0 auto; }
  .panel { padding-top: 64px; }
  .chips { grid-template-columns: repeat(2, 1fr); }
  body[data-view="race"] main { grid-template-columns: minmax(0, 1fr) 300px; }
  body[data-view="race"] .stage { max-width: 860px; }
}
</style>
<script>
// Any script error shows at the bottom of the page, so a blank board on some phone can be read off the screen.
window.onerror = function (m, src, line, col) {
  var d = document.getElementById('err') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'err' }));
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;margin:0;padding:8px 10px;z-index:9;white-space:pre-wrap;font:12px/1.4 monospace;color:#ffb4b4;background:rgba(40,0,0,.9);border-radius:8px';
  d.textContent += '出错了：' + m + ' (' + line + ':' + col + ')\n' + navigator.userAgent + '\n';
};
</script>

        const pos = positions(w.loop), back = pos.has(body[0]) && pos.has(body.at(-1)) ? along(w.loop, pos, body[0], body.at(-1)) : null;
        if (back && back.length > 1) drawPath(ctx, B, back, C.gold, { width: 4, alpha: 0.7 * calm });
        if (S.snake === 'cycle' && r.foods[k] >= 0 && pos.has(r.foods[k])) drawPath(ctx, B, along(w.loop, pos, body[0], r.foods[k]), C.blue, { width: 6, alpha: calm });
      }
      if (w.route && w.route.length > 1 && w.kind !== 'tail') drawPath(ctx, B, w.route, w.kind === 'stuck' ? C.red : C.blue, { width: 5, alpha: 0.9 * calm });
      if (w.kind === 'tail' && w.tail) drawPath(ctx, B, w.tail, C.gold, { width: 4, alpha: 0.85 * calm });
      if ((S.snake === 'bfs-tail' || S.snake === 'c-directed') && w.back && w.back.length > 1 && sps <= 32) drawPath(ctx, B, w.back, C.gold, { width: 4, alpha: 0.8 * calm });
    }
    drawApple(ctx, B, r.foods[k], now);
    // the imagined body (eaten in imagination) only while stepping or slow, with the real one stepped back
    const dead = r.outcome === 'dead' && k >= r.steps ? 1 : 0, imagine = lines && ghost && w.kind !== 'tail' && (!S.playing || sps <= 3) ? 1 : 0;
    drawSnake(ctx, B, body, next, f, { dead, dim: 0.55 * imagine });
    if (imagine) drawGhost(ctx, B, ghost, 0.8);
    if (lines && w.kind === 'tail' && ghost && S.snake === 'bfs-tail' && sps <= 32) { const [x, y] = B.xy(ghost[0]); cross(ctx, x, y, 18, C.red, 0.9 * calm); }
    // bites: a gold ring off the head for half a second of play (by the playhead, so scrubbing shows them too)
    const span = Math.max(1, sps * 0.5), pk = this.p;
    if (sps <= 32) for (let j = Math.max(0, Math.floor(pk - span)); j <= Math.floor(pk) && j < r.ate.length; j++) {
      if (!r.ate[j]) continue;
      const u = (pk - (j + 1)) / span;
      if (u < 0 || u > 1) continue;
      const [x, y] = B.xy(r.heads[j + 2]); ctx.save(); ctx.strokeStyle = rgba(C.gold, 0.85 * (1 - u)); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 18 + 52 * outCubic(u), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    if (this.flash) drawFullFlash(ctx, B, (now - this.flash) / 0.9);
    if (dead) { const [x, y] = B.xy(body[0]); glowDot(ctx, x, y, 110, C.red, 0.35); if (r.crash >= 0) { const [cx, cy] = B.xy(r.crash); cross(ctx, cx, cy, 16, C.red, 0.95); } }
    // text
    $('#len').textContent = body.length; $('#cells').textContent = `/ ${r.cells}`;
    $('#step').textContent = `第 ${k} 步`;
    $('#why').innerHTML = sps > 32 && S.playing ? '<span class="dim">快进中</span>' : rich(r.outcome && k >= r.steps && r.outcome !== 'cycle' ? endText(S.snake, r) : whyText(S.snake, w, r, k));
    const banner = $('#banner'), out = r.outcome === 'cycle' && this.p >= r.loop.start + r.loop.length ? 'cycle' : r.outcome && r.outcome !== 'cycle' && k >= r.steps ? r.outcome : null;
    banner.className = out ? `banner show ${out}` : 'banner';
    if (out) banner.innerHTML = out === 'won' ? `<b>吃满</b><span>${r.steps} 步 · 吃了 ${r.lens[r.steps] - 2} 口</span>`
      : out === 'dead' ? `<b>撞死</b><span>${r.lens[r.steps]} / ${r.cells} · 第 ${r.steps} 步</span>`
      : out === 'cycle' ? `<b>原地绕圈</b><span>${r.lens[r.loop.start]} / ${r.cells} · 第 ${r.loop.start} 步起，每 ${r.loop.length} 步一圈</span>`
      : `<b>到上限了</b><span>${r.steps} 步</span>`;
    drawScrubber();
  },
};

// The scrubber: the whole game as a track, meals as gold ticks, the recorded part lit.
function drawScrubber() {
  const cv = $('#scrub'), ctx = cv.getContext('2d'), { w, h, dpr } = fit(cv), r = Single.rec;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h);
  const pad = 10 * dpr, x0 = pad, x1 = w - pad, y = h / 2, total = Math.max(r.steps, 1), X = k => x0 + (x1 - x0) * Math.min(1, k / total);
  const done = !!r.outcome, est = done ? total : total * 1.15;
  const XX = k => x0 + (x1 - x0) * Math.min(1, k / est);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 6 * dpr; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(142,166,216,0.35)'; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(XX(r.steps), y); ctx.stroke();
  ctx.fillStyle = rgba(C.gold, 0.8);
  let lastX = -1;
  r.ate.forEach((a, k) => { if (!a) return; const x = XX(k + 1); if (x - lastX < 2 * dpr) return; lastX = x; ctx.fillRect(x - 0.75 * dpr, y - 7 * dpr, 1.5 * dpr, 14 * dpr); });
  const p = Math.min(Single.p, r.steps), px = XX(p);
  ctx.strokeStyle = rgba(C.text, 0.9); ctx.lineWidth = 6 * dpr; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(px, y); ctx.stroke();
  ctx.fillStyle = rgba(C.text); ctx.beginPath(); ctx.arc(px, y, 8 * dpr, 0, Math.PI * 2); ctx.fill();
  if (done) { ctx.fillStyle = rgba(r.outcome === 'won' ? C.gold : C.red); ctx.beginPath(); ctx.arc(x1, y, 5 * dpr, 0, Math.PI * 2); ctx.fill(); }
  return { x0: x0 / dpr, x1: x1 / dpr, est };
}

// ---- the race: six snakes, one opening ------------------------------------------------------
const Race = {
  recs: [], B: null, s: 0, flashes: {}, done: false,
  start() {
    const [w, h] = dims(); this.recs = SNAKES.map(sn => new Recording(sn.id, w, h, S.raceSeed, S.wrap)); this.B = new Board(w, h, S.wrap);
    this.s = 0; this.flashes = {}; this.done = false; S.playing = true;
    $('#racegrid').innerHTML = SNAKES.map((sn, j) => `<div class="card" data-j="${j}"><canvas></canvas><div class="name">${sn.name}</div><div class="status" id="rs${j}">0 步</div></div>`).join('');
    $('#results').innerHTML = '';
    renderControls();
  },
  endOf: r => (!r.outcome ? Infinity : r.outcome === 'cycle' ? r.loop.start : r.steps),
  tick(dt) {
    for (const r of this.recs) if (!r.outcome) r.advance(3);
    if (!S.playing) return;
    const sps = SPEEDS[S.speed].sps, limit = Math.min(...this.recs.map(r => (r.outcome ? Infinity : r.steps - 1)));
    const before = this.s;
    this.s = Math.min(limit, this.s + sps * dt);
    this.recs.forEach((r, j) => {
      const e = this.endOf(r);
      if (before < e && this.s >= e && r.outcome !== 'cycle') { this.flashes[j] = performance.now() / 1000; if (r.outcome === 'won') Sound.full(); else if (r.outcome === 'dead') Sound.crash(); }
    });
    const last = Math.max(...this.recs.map(r => (r.outcome === 'won' || r.outcome === 'dead' || r.outcome === 'limit' ? r.steps : r.outcome === 'cycle' ? r.loop.start : Infinity)));
    if (this.s >= last && !this.done) { this.s = last; this.done = true; S.playing = false; this.results(); renderControls(); }
  },
  results() {
    const rows = this.recs.map((r, j) => ({ j, r })), won = rows.filter(x => x.r.outcome === 'won').sort((a, b) => a.r.steps - b.r.steps), rest = rows.filter(x => x.r.outcome !== 'won');
    $('#results').innerHTML = [...won.map((x, i) => `<li class="${i ? '' : 'first'}"><span class="rank">${i + 1}</span><span>${SNAKES[x.j].name}</span><span class="num">${x.r.steps} 步吃满</span></li>`),
      ...rest.map(x => `<li class="out"><span class="rank">—</span><span>${SNAKES[x.j].name}</span><span class="num">${x.r.outcome === 'dead' ? `撞死 · ${x.r.lens[x.r.steps]} 格` : x.r.outcome === 'cycle' ? `原地绕圈 · ${x.r.lens[x.r.loop.start]} 格` : '到上限'}</span></li>`)].join('');
  },
  draw() {
    const now = performance.now() / 1000;
    this.recs.forEach((r, j) => {
      const card = $(`.card[data-j="${j}"]`), cv = card.querySelector('canvas'), ctx = cv.getContext('2d'), B = this.B;
      boardTransform(ctx, cv, B); drawBase(ctx, B);
      const e = this.endOf(r);
      let k = Math.floor(this.s), f = this.s - k;
      if (r.outcome === 'cycle' && k >= r.loop.start) k = r.loop.start + ((k - r.loop.start) % r.loop.length);
      else if (k >= r.steps) { k = r.steps; f = 0; }
      const over = r.outcome && r.outcome !== 'cycle' && this.s >= r.steps;
      drawApple(ctx, B, r.foods[k], now);
      drawSnake(ctx, B, r.body(k), k < r.steps ? r.body(k + 1) : null, f, { dead: over && r.outcome === 'dead' ? 1 : 0 });
      if (this.flashes[j] && r.outcome === 'won') drawFullFlash(ctx, B, (now - this.flashes[j]) / 0.9);
      card.className = `card ${over ? r.outcome : r.outcome === 'cycle' && this.s >= e ? 'cycle' : ''}`;
      const len = r.lens[k], rank = over && r.outcome === 'won' ? 1 + this.recs.filter(q => q.outcome === 'won' && q.steps < r.steps && this.s >= q.steps).length : 0;
      $(`#rs${j}`).textContent = over ? (r.outcome === 'won' ? `第 ${rank} · ${r.steps} 步吃满` : r.outcome === 'dead' ? `撞死 · ${len} / ${r.cells}` : `${r.steps} 步`)
        : r.outcome === 'cycle' && this.s >= e ? `绕圈 · ${len} / ${r.cells}` : `${Math.floor(Math.min(this.s, r.steps))} 步 · ${len} 格`;
    });
    $('#racestep').textContent = `第 ${Math.floor(this.s)} 步`;
  },
};

// ---- controls ---------------------------------------------------------------------------------
function renderControls() {
  document.body.dataset.view = S.view;
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  const sn = SNAKES.find(x => x.id === S.snake);
  $('#name').textContent = sn.name; $('#en').textContent = sn.en; $('#line').textContent = sn.line;
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === S.snake)));
  document.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', String(!S.custom && +b.dataset.size === S.n)));
  $('#wrap').checked = S.wrap; $('#custom').checked = S.custom; $('#dims').hidden = !S.custom; $('#cw').value = S.cw; $('#ch').value = S.ch; $('#lines').checked = S.lines; $('#sound').setAttribute('aria-pressed', String(S.sound));
  $('#seed').value = S.view === 'race' ? S.raceSeed : S.seed;
  document.querySelectorAll('.play').forEach(b => { b.setAttribute('aria-label', S.playing ? '暂停' : '播放'); b.dataset.state = S.playing ? 'pause' : 'play'; });
  document.querySelectorAll('.speed').forEach(b => { b.textContent = SPEEDS[S.speed].label; });
  $('#hint').innerHTML = S.view === 'single' ? rich(hintFor(S.snake, ...dims(), S.wrap)) : '';
}
const restart = () => { save(); (S.view === 'race' ? Race : Single).start(); };
function bind() {
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { if (S.view !== b.dataset.view) { S.view = b.dataset.view; restart(); } }));
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { S.snake = b.dataset.id; restart(); }));
  document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => { S.n = +b.dataset.size; S.custom = false; restart(); }));
  $('#wrap').addEventListener('change', e => { S.wrap = e.target.checked; restart(); });
  // a custom size starts from the board on screen; the game restarts only once the size changes
  $('#custom').addEventListener('change', e => {
    const before = dims().join();
    S.custom = e.target.checked;
    if (S.custom) S.cw = S.ch = S.n;
    if (dims().join() !== before) restart(); else { save(); renderControls(); }
  });
  for (const id of ['cw', 'ch']) $(`#${id}`).addEventListener('change', e => { S[id] = side(e.target.value, S[id]); restart(); });
  $('#lines').addEventListener('change', e => { S.lines = e.target.checked; save(); });
  $('#sound').addEventListener('click', () => { S.sound = !S.sound; if (S.sound) Sound.on(); renderControls(); });
  const setSeed = v => { v = Math.max(1, Math.min(99999, Math.round(+v) || 1)); if (S.view === 'race') S.raceSeed = v; else S.seed = v; restart(); };
  $('#seed').addEventListener('change', e => setSeed(e.target.value));
  $('#dice').addEventListener('click', () => setSeed(1 + Math.floor(Math.random() * 9999)));
  const togglePlay = () => {
    const m = S.view === 'race' ? Race : Single;
    if (!S.playing && S.view === 'single' && Single.ended) { Single.p = 0; Single.ended = false; Single.flash = 0; }
    if (!S.playing && S.view === 'race' && Race.done) { Race.s = 0; Race.done = false; Race.flashes = {}; $('#results').innerHTML = ''; }
    S.playing = !S.playing; if (S.sound) Sound.on(); renderControls(); void m;
  };
  document.querySelectorAll('.play').forEach(b => b.addEventListener('click', togglePlay));
  $('#board').addEventListener('click', togglePlay);
  document.querySelectorAll('.speed').forEach(b => b.addEventListener('click', () => { S.speed = (S.speed + 1) % SPEEDS.length; save(); renderControls(); }));
  document.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => { S.playing = false; Single.p = Math.max(0, Math.min(Single.rec.steps, Math.round(Single.p) + +b.dataset.d)); renderControls(); }));
  // dragging the scrubber
  const scrub = $('#scrub');
  let dragging = false;
  const seek = e => { const g = drawScrubber(), r = scrub.getBoundingClientRect(), x = (e.clientX - r.left - g.x0) / (g.x1 - g.x0); Single.p = Math.max(0, Math.min(Single.rec.steps, Math.round(x * g.est))); Single.ended = false; Single.flash = 0; };
  scrub.addEventListener('pointerdown', e => { dragging = true; scrub.setPointerCapture(e.pointerId); S.playing = false; renderControls(); seek(e); });
  scrub.addEventListener('pointermove', e => { if (dragging) seek(e); });
  scrub.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { if (S.view !== 'single') return; e.preventDefault(); S.playing = false; Single.p = Math.max(0, Math.min(Single.rec.steps, Math.round(Single.p) + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 10 : 1))); renderControls(); }
    else if (e.key >= '1' && e.key <= '6' && S.view === 'single') { S.snake = SNAKES[+e.key - 1].id; restart(); }
    else if (e.key === 'r' || e.key === 'R') $('#dice').click();
  });
}

let lastT = 0;
function step(t) {   // one frame at time t (ms)
  const dt = Math.min(0.1, (t - lastT) / 1000 || 0); lastT = t;
  const m = S.view === 'race' ? Race : Single;
  m.tick(dt); m.draw();
}
function frame(t) { step(t); requestAnimationFrame(frame); }
window.__lab = { step, S, Single, Race };   // for testing the page headless (no animation frames there)
function init() {
  $('#chips').innerHTML = SNAKES.map((sn, j) => `<button class="chip" data-id="${sn.id}" aria-pressed="false"><b>${sn.name}</b><span>${['01', '02', '03', '04', '05', '06'][j]}</span></button>`).join('');
  $('#sizes').innerHTML = SIZES.map(n => `<button data-size="${n}" aria-pressed="false">${n}×${n}</button>`).join('');
  bind(); restart(); requestAnimationFrame(frame);
}
document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();

})();</script>
</body>
